name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: The need
      description: What you are trying to do, and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How you imagine it. Optional.
