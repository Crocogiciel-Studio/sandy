name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: sandy, `sbx version`, and your OS.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
