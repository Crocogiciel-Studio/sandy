name: Release

# A version tag (v1.2.3) builds the installers on each OS and publishes them on GitHub Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest, args: --mac --arm64 }
          - { name: macOS x64, os: macos-15-intel, args: --mac --x64 }
          - { name: Windows x64, os: windows-latest, args: --win --x64 }
          - { name: Linux x64, os: ubuntu-latest, args: --linux --x64 }
          - { name: Linux arm64, os: ubuntu-24.04-arm, args: --linux --arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # The tag is the version: v1.2.3 ships as 1.2.3 without touching package.json.
      - name: Package
        shell: bash
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}-${{ matrix.args }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
